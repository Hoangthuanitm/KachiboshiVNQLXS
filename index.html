<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kachiboshi QC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;600;700&display=swap">
<style>
/* Layout: dải thương hiệu xanh than; công nhân dùng một cột cỡ điện thoại,
   dashboard / phân công / danh mục mở rộng lưới 12 cột trên máy tính. Mỗi loại phiếu có màu nhận diện riêng. */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --sunk:#E6EAF1; --line:#D8DEE7; --grid:#E9EDF3; --ink:#122033; --muted:#5B6879;
  --brand:#0C2340; --brand-2:#183E69; --brand-ink:#FFFFFF; --brand-muted:#A9BCD6;
  --accent:#1D5FAF; --accent-ink:#FFFFFF; --accent-soft:#E2ECF9;
  --ok:#16784B; --ok-bg:#DFF3E7; --bad:#C42F27; --bad-bg:#FCE5E2; --warn:#975600; --warn-bg:#FFF0D1;
  --stop:#7A8696; --stop-bg:#E6EAF1;
  --c-kk:#6A46D3; --c-qccs:#0B8466; --c-iscs:#C0620B; --c-ispvc:#1F6CCF; --c-qtpvc:#B33A7E;
  --f-ui:"Be Vietnam Pro","Noto Sans JP",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-jp:"Noto Sans JP","Be Vietnam Pro",system-ui,sans-serif;
  --r:16px; --tap:60px; --shadow:0 1px 2px rgb(12 35 64/.05),0 6px 18px rgb(12 35 64/.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D131C; --surface:#161F2B; --sunk:#202B39; --line:#2C3949; --grid:#222D3B; --ink:#E6ECF3; --muted:#9AA7B7;
  --brand:#0A1A2E; --brand-2:#17375C; --brand-ink:#F2F6FB; --brand-muted:#8EA4C2;
  --accent:#6AA8EE; --accent-ink:#06121F; --accent-soft:#17304D;
  --ok:#4BC488; --ok-bg:#123222; --bad:#FF7D71; --bad-bg:#3A1A17; --warn:#F2B24C; --warn-bg:#372A10;
  --stop:#8592A3; --stop-bg:#222C39;
  --c-kk:#7C5CE0; --c-qccs:#14936F; --c-iscs:#C46D1A; --c-ispvc:#2C78D6; --c-qtpvc:#BC4789;
  --shadow:0 1px 2px rgb(0 0 0/.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D131C; --surface:#161F2B; --sunk:#202B39; --line:#2C3949; --grid:#222D3B; --ink:#E6ECF3; --muted:#9AA7B7;
  --brand:#0A1A2E; --brand-2:#17375C; --brand-ink:#F2F6FB; --brand-muted:#8EA4C2;
  --accent:#6AA8EE; --accent-ink:#06121F; --accent-soft:#17304D;
  --ok:#4BC488; --ok-bg:#123222; --bad:#FF7D71; --bad-bg:#3A1A17; --warn:#F2B24C; --warn-bg:#372A10;
  --stop:#8592A3; --stop-bg:#222C39;
  --c-kk:#7C5CE0; --c-qccs:#14936F; --c-iscs:#C46D1A; --c-ispvc:#2C78D6; --c-qtpvc:#BC4789;
  --shadow:0 1px 2px rgb(0 0 0/.3); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
html[lang="ja"] body{font-family:var(--f-jp)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:default}
input,textarea,select{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg.i{width:1.2em;height:1.2em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--brand);color:var(--brand-ink)}
.top-in{max-width:var(--maxw,600px);margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;min-height:64px}
.logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#2C7BD8,#0E4A8F);display:grid;place-items:center;font-weight:800;font-size:20px;color:#fff;flex:none;box-shadow:inset 0 0 0 1px rgb(255 255 255/.2)}
.brand{flex:1;min-width:0;line-height:1.15}
.brand b{display:block;font-size:15px;letter-spacing:.08em;font-weight:800}
.brand span{font-size:12.5px;color:var(--brand-muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand h1{margin:0;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{height:42px;min-width:42px;padding:0 12px;border-radius:11px;background:rgb(255 255 255/.1);color:var(--brand-ink);font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:none}
.tbtn:hover{background:rgb(255 255 255/.18)}
.tbtn .nm{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:420px){.tbtn .nm{display:none}}
.ava{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;flex:none}
.ava svg{width:17px;height:17px}
.tabs{max-width:var(--maxw,600px);margin:0 auto;padding:0 12px 8px;display:flex;gap:4px;overflow-x:auto}
.tabs button{flex:1;min-height:42px;border-radius:10px;font-weight:600;font-size:14.5px;color:var(--brand-muted);display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;padding:0 10px}
.tabs button[aria-selected="true"]{background:var(--brand-2);color:var(--brand-ink)}
@media (max-width:460px){.tabs button svg{display:none}.tabs button{font-size:13.5px;padding:0 6px}}

#app{max-width:var(--maxw,600px);margin:0 auto;padding-inline:16px;padding-block:16px 130px}
body.wide{--maxw:1180px}

.banner{display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:500;margin-bottom:14px}
.label{font-size:12.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:24px 2px 10px;display:flex;align-items:center;gap:8px}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;box-shadow:var(--shadow)}
.card h3{margin:0 0 12px;font-size:15.5px;display:flex;align-items:center;gap:10px}
.card h3 .sub{margin-left:auto;font-size:12.5px;font-weight:500;color:var(--muted)}
.fi{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff}
.fi svg{width:19px;height:19px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:24px;text-align:center;color:var(--muted)}

/* ---------- login ---------- */
.login{max-width:420px;margin:24px auto 0;display:grid;gap:16px}
.login .card{padding:24px;display:grid;gap:14px}
.login h2{margin:0;font-size:24px}
.lfield{display:grid;gap:6px}
.lfield span{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.lfield input{height:56px;border-radius:13px;border:2px solid var(--line);background:var(--bg);padding:0 16px;font-size:19px;font-weight:600;width:100%}
.lfield input:focus{border-color:var(--accent);outline:none}
.pwrap{position:relative}
.pwrap button{position:absolute;right:6px;top:6px;height:44px;width:48px;border-radius:10px;color:var(--muted);display:grid;place-items:center}
.check{display:flex;align-items:center;gap:10px;font-size:15px;min-height:44px}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.big{min-height:58px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:18px;letter-spacing:.04em;display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
.hint{font-size:13.5px;color:var(--muted);text-align:center}

/* ---------- my tasks ---------- */
.hello{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;box-shadow:var(--shadow)}
.hello-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.hello-top b{font-size:20px}
.prog{height:10px;border-radius:999px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);border-radius:999px}
.tasks{display:grid;gap:12px}
.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px;box-shadow:var(--shadow)}
.task-h b{font-size:20px}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.slot{min-height:66px;border-radius:12px;padding:8px 12px;text-align:left;display:flex;flex-direction:column;justify-content:center;font-weight:800;font-size:17px;border:2px solid transparent}
.slot small{font-weight:600;font-size:12.5px;opacity:.9}
.s-todo{background:var(--accent);color:var(--accent-ink)}
.s-wait{background:var(--sunk);color:var(--muted)}
.s-late{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.s-OK{background:var(--ok-bg);color:var(--ok)}
.s-X{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.s-STOP{background:var(--stop-bg);color:var(--stop)}

/* ---------- form ---------- */
.fhead{border-radius:var(--r);padding:16px;color:#fff;display:flex;align-items:center;gap:14px}
.fhead .fi{background:rgb(255 255 255/.2);width:46px;height:46px;border-radius:13px}
.fhead .fi svg{width:24px;height:24px}
.fhead b{display:block;font-size:22px;line-height:1.15}
.fhead span{font-size:14px;opacity:.92}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:52px;border-radius:12px;background:var(--surface);border:2px solid var(--line);font-weight:700;font-size:15.5px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;padding:4px 6px}
.seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.seg button.st-broken[aria-pressed="true"]{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.seg button.st-off[aria-pressed="true"]{border-color:var(--stop);color:var(--stop);background:var(--stop-bg)}
.pick{width:100%;min-height:var(--tap);background:var(--surface);border:2px dashed var(--line);border-radius:14px;font-size:18px;font-weight:700;text-align:left;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.pick.set{border-style:solid;border-color:var(--accent)}
.pick.need{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.stack{display:grid;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px;box-shadow:var(--shadow)}
.item.isX{border:2px solid var(--bad)}
.item-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.item-name{flex:1;min-width:150px;font-size:18px;font-weight:700;line-height:1.25}
.item-name small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.okx{display:flex;gap:8px}
.okx button{width:86px;height:var(--tap);border-radius:12px;font-size:19px;font-weight:800;background:var(--sunk);color:var(--muted);display:flex;align-items:center;justify-content:center;gap:4px}
.okx button.ok[aria-pressed="true"]{background:var(--ok);color:#fff}
.okx button.x[aria-pressed="true"]{background:var(--bad);color:#fff}
.pos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pos button{min-height:var(--tap);border-radius:12px;font-weight:800;font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;gap:2px}
.pos button small{font-size:12px;font-weight:600;opacity:.9}
.pos button[data-v="OK"]{background:var(--ok-bg);color:var(--ok)}
.pos button[data-v="X"]{background:var(--bad);color:#fff}
.xbox{display:grid;gap:10px;border-top:1px dashed var(--line);padding-top:12px}
.notify{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:700;color:var(--bad);background:var(--bad-bg);border-radius:10px;padding:8px 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:46px;padding:8px 14px;border-radius:999px;background:var(--sunk);font-weight:600;font-size:15px;border:2px solid transparent}
.chip[aria-pressed="true"]{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.note{width:100%;min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:12px;font-size:16px;resize:vertical}
.meas{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.meas input{flex:1;min-width:0;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px;font-variant-numeric:tabular-nums}
.addl2{width:100%;min-height:56px;border-radius:14px;border:2px dashed var(--accent);font-weight:700;font-size:17px;color:var(--accent);display:flex;align-items:center;justify-content:center;gap:8px}
.l2row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.l2row b{flex:1;min-width:0}
.l2row span{font-variant-numeric:tabular-nums;font-weight:800;color:var(--warn)}
.del{width:44px;height:44px;border-radius:10px;background:var(--sunk);color:var(--muted);display:grid;place-items:center}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgb(12 35 64/.08)}
.savebar button{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:568px;margin:0 auto;min-height:62px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-size:21px;font-weight:800;letter-spacing:.05em}
.err{color:var(--bad);font-weight:700;font-size:14px;text-align:center;margin:0 0 8px}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgb(8 16 28/.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:600px;max-height:88%;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;align-content:start}
.sheet-h{display:flex;align-items:center;gap:10px}
.sheet-h b{flex:1;font-size:19px;display:flex;align-items:center;gap:8px}
.x-btn{width:44px;height:44px;border-radius:12px;background:var(--sunk);display:grid;place-items:center;flex:none}
.search{width:100%;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 14px;font-size:17px}
.opts{display:grid;gap:8px}
.opt{min-height:54px;border-radius:12px;background:var(--sunk);text-align:left;padding:8px 14px;font-weight:600;font-size:17px}
.opt small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.opt.cur{background:var(--accent);color:var(--accent-ink)}
.opt.cur small{color:var(--accent-ink)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:64px;height:64px;border-radius:14px;background:var(--sunk);font-size:30px;font-weight:700}
.stepper input{flex:1;min-width:0;height:64px;text-align:center;font-size:30px;font-weight:800;border-radius:14px;border:2px solid var(--line);background:var(--bg);font-variant-numeric:tabular-nums}
.primary{min-height:48px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:15.5px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.ghost{min-height:44px;border-radius:11px;background:var(--sunk);font-weight:600;padding:0 14px;display:inline-flex;align-items:center;gap:8px;font-size:14.5px}
.danger{color:var(--bad)}
.me-card{display:flex;gap:14px;align-items:center;background:var(--bg);border-radius:14px;padding:14px}
.me-card .ava{width:52px;height:52px;font-size:18px}

/* ---------- dashboard ---------- */
.dhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.dhead h2{margin:0;font-size:22px;flex:1;min-width:200px;text-wrap:balance}
.dhead h2 small{display:block;font-size:13px;font-weight:500;color:var(--muted)}
.datenav{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.datenav b{min-width:112px;text-align:center;font-size:15.5px;font-variant-numeric:tabular-nums}
.nbtn{width:38px;height:38px;border-radius:9px;display:grid;place-items:center}
.nbtn:hover:not(:disabled){background:var(--sunk)}
.nbtn:disabled{opacity:.3}
.dgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.span3{grid-column:span 3}.span4{grid-column:span 4}.span5{grid-column:span 5}.span7{grid-column:span 7}.span8{grid-column:span 8}.span6{grid-column:span 6}.span12{grid-column:span 12}
@media (max-width:1000px){.span3{grid-column:span 6}.span4,.span5,.span7,.span8{grid-column:span 12}}
@media (max-width:560px){.span3,.span6{grid-column:span 12}}
.kpi{display:grid;gap:6px;align-content:start}
.kpi-top{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
.kpi-top .ki{width:28px;height:28px;border-radius:8px;display:grid;place-items:center}
.kpi-top .ki svg{width:16px;height:16px}
.kpi-val{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.kpi-val b{font-size:32px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi-val span{font-size:13px;color:var(--muted)}
.delta{font-size:12.5px;font-weight:700;padding:2px 8px;border-radius:999px}
.d-good{background:var(--ok-bg);color:var(--ok)} .d-bad{background:var(--bad-bg);color:var(--bad)} .d-flat{background:var(--sunk);color:var(--muted)}
.spark{width:100%;height:38px;display:block}
.fprog{display:grid;gap:16px}
.frow{display:grid;gap:8px}
.frow-h{display:flex;align-items:center;gap:10px}
.frow-h b{flex:1;font-size:15px;min-width:0}
.frow-h .cnt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.frow-h .cnt b{color:var(--ink);font-size:15px}
.sbar{display:flex;gap:2px;height:12px;border-radius:999px;background:var(--sunk);overflow:hidden}
.sbar i{display:block;height:100%}
.sbar .g{background:var(--ok)} .sbar .r{background:var(--bad)} .sbar .s{background:var(--stop)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.mtx{width:100%;border-collapse:separate;border-spacing:0 4px;font-size:13.5px}
.mtx td{padding:0 4px;border:0}
.mtx td:first-child{color:var(--muted);font-weight:600;white-space:nowrap;width:1%;padding-right:10px}
.pill{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:8px;font-size:12.5px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;width:100%;justify-content:flex-start}
.pill svg{width:14px;height:14px}
.p-OK{background:var(--ok-bg);color:var(--ok)} .p-X{background:var(--bad-bg);color:var(--bad)} .p-STOP{background:var(--stop-bg);color:var(--stop)}
.p-late{background:transparent;color:var(--warn);box-shadow:inset 0 0 0 1px var(--line)}
.p-wait,.p-todo{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line)}
.feed{display:grid}
.issue{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:11px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.issue:last-child{border-bottom:0}
.issue .dot{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--bad-bg);color:var(--bad);grid-row:span 3}
.issue .dot svg{width:15px;height:15px}
.issue b{font-size:14.5px}
.issue .meta{font-size:12.5px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-ui);font-size:11px;fill:var(--muted)}
.pareto{display:grid;gap:9px}
.prow{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;align-items:center;gap:10px;font-size:13.5px}

const clone = o => JSON.parse(JSON.stringify(o));
function mergeMaster(m){
  const d = clone(DEFAULT_MASTER);
  if(!m) return d;
  const out = {...d, ...clone(m)};
  delete out.adminPin;
  ["employees","products","errors","machines"].forEach(k=>{ if(!Array.isArray(out[k])) out[k]=d[k]; });
  out.forms = {...d.forms, ...(out.forms||{})};
  FORM_ORDER.forEach(f=>{ out.forms[f] = {...d.forms[f], ...(out.forms[f]||{})}; });
  out.products.forEach(p=>{ p.aliases ??= ""; p.type ??= ""; });
  out.errors.forEach(e=>{ e.type ??= ""; });
  if(!out.employees.some(e=>e.role==="AD"&&e.active)) out.employees.unshift(d.employees[0]);
  return out;
}

const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const hm  = d => pad(d.getHours())+":"+pad(d.getMinutes());
const todayStr = () => ymd(new Date());

const toMin = s => { const [h,m]=String(s||"0:0").split(":").map(Number); return h*60+(m||0); };
const shiftDate = (s,n) => { const [y,m,d]=s.split("-").map(Number); return ymd(new Date(y,m-1,d+n)); };

/* ===================== MẬT KHẨU ===================== */
async function hashPw(pw, salt){
  const s = salt+"|"+pw;
  try{
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
  }catch(e){
    let h1=2166136261, h2=5381;
    for(const ch of s){ const c=ch.codePointAt(0); h1^=c; h1=Math.imul(h1,16777619)>>>0; h2=(Math.imul(h2,33)+c)>>>0; }
    return "f"+h1.toString(16)+h2.toString(16);
  }
}
const newSalt = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36);

const store = {
  mode:"local", db:null, dl:null, subs:{}, mem:{},
  async init(){
    try{
      if(window.claude && window.claude.use){
        const db = await window.claude.use("db");
        if(db){ this.db = db; this.mode = "db"; }
        window.claude.use("downloads").then(d=>{ this.dl = d; }).catch(()=>{});
      }
    }catch(e){}
  },
  lsGet(k,def){ try{ const v=localStorage.getItem(k); if(v!=null) return JSON.parse(v); }catch(e){} return this.mem[k] ?? def; },
  lsSet(k,v){ this.mem[k]=v; try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} },
  stop(key){ if(this.subs[key]){ this.subs[key](); delete this.subs[key]; } },
  stopAll(){ Object.keys(this.subs).forEach(k=>this.stop(k)); },
  watchByDate(col, date, cb){
    this.stop(col);
    if(this.mode==="db"){
      this.subs[col] = this.db.collection(col).where("date","==",date).onSnapshot(
        s=>{ const m={}; s.docs.forEach(d=>m[d.id]=d.data()); cb(m); }, ()=>{});
    } else {
      const all=this.lsGet("qc_"+col,{}); const m={};
      Object.entries(all).forEach(([k,v])=>{ if(v.date===date) m[k]=v; }); cb(m);
    }
  },
  async byDate(col, date){
    if(this.mode==="db"){ const s=await this.db.collection(col).where("date","==",date).get(); const m={}; s.docs.forEach(d=>m[d.id]=d.data()); return m; }
    const all=this.lsGet("qc_"+col,{}); const m={}; Object.entries(all).forEach(([k,v])=>{ if(v.date===date) m[k]=v; }); return m;
  },
  async range(col,a,b){
    if(this.mode==="db"){
      const s = await this.db.collection(col).where("date",">=",a).where("date","<=",b).limit(1000).get();
      return s.docs.map(d=>({...d.data(), _id:d.id}));
    }
    return Object.entries(this.lsGet("qc_"+col,{})).filter(([k,r])=>r.date>=a&&r.date<=b).map(([k,r])=>({...r,_id:k}));
  },
  async setDoc(col,id,data){
    if(this.mode==="db") await this.db.collection(col).doc(id).set(data);
    else { const all=this.lsGet("qc_"+col,{}); all[id]=data; this.lsSet("qc_"+col,all); }
  },
  async getDoc(col,id){
    if(this.mode==="db"){ const s=await this.db.collection(col).doc(id).get(); return s.exists?s.data():null; }
    return this.lsGet("qc_"+col,{})[id] || null;
  },
  async delDoc(col,id){
    if(this.mode==="db") await this.db.collection(col).doc(id).delete();
    else { const all=this.lsGet("qc_"+col,{}); delete all[id]; this.lsSet("qc_"+col,all); }
  },
  async listIds(col){
    if(this.mode==="db"){ const s=await this.db.collection(col).limit(1000).get(); return s.docs.map(d=>d.id); }
    return Object.keys(this.lsGet("qc_"+col,{}));
  },
  watchMaster(cb){
    if(this.mode==="db") this.db.doc("master/config").onSnapshot(s=>cb(s.exists ? s.data() : null), ()=>{});
    else cb(this.lsGet("qc_master",null));
  },
  async saveMaster(m){
    if(this.mode==="db") await this.db.doc("master/config").set(m);
    else this.lsSet("qc_master",m);
  }
};
async function offerFile(name, text, mime){
  if(store.dl){
    try{ await store.dl.save({filename:name, data:text}); return; }
    catch(e){ if(e && e.code==="declined") return; }
  }
  try{
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:mime})); a.download=name;
    document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},800);
  }catch(e){ toastErr(t("saveErr")); }
}

                       : `<button class="big" data-act="finalApprove" data-d="${x.date}">${ico("check")}${t("finalBtn")} ${shortDate(x.date)}</button>`;
      h += `</div>`;
    });
    h += `</div>`;
  }
  const fin = days.filter(x=>x.final);
  if(fin.length){
    h += `<div class="label">${ico("lock")}${t("recentFinal")}</div><div class="rev">`+fin.map(x=>`<div class="revrow" style="cursor:default"><span class="nm">${esc(dayName(x.date))}</span><span class="badge b-ok">${ico("check")}${t("finalDone")} · ${esc(x.final.name)} · ${esc(x.final.time)}</span>${ad?`<button class="ghost" style="min-height:36px" data-act="finalUndo" data-d="${x.date}">${t("finalUndo")}</button>`:""}</div>`).join("")+`</div>`;
  }
  return h;
}
function vTasks(e){
  const date = todayStr();
  const tasks = myTasks(e, date);
  const review = vReview(e);
  if(!tasks.length && review){
    return `<div class="hello"><div class="hello-top"><b>${t("myWork")}</b><span class="muted">${showDate(date)}</span></div></div>`+review;
  }
  if(!tasks.length){
    const lead = leadsOf(e.dept);
    return `<div class="hello"><div class="hello-top"><b>${t("myWork")}</b><span class="muted">${showDate(date)}</span></div></div>
      <div class="empty" style="margin-top:14px">${ico("cal")}<p style="margin:8px 0 4px;font-weight:700;color:var(--ink)">${t("notAssigned")}</p>${lead?`<p style="margin:0">${t("askLead")}: ${esc(lead)}</p>`:""}</div>`;
  }
  const done = tasks.filter(x=>S.recs[recId(date,x.f,x.m,x.i)]).length;
  let h = `<div class="hello"><div class="hello-top"><b>${t("myWork")}</b><span class="muted"><b style="font-size:16px;color:var(--ink)">${done}/${tasks.length}</b> ${t("progress")}</span></div>
    <div class="prog"><i style="width:${Math.round(done/tasks.length*100)}%"></i></div></div>`;
  FORM_ORDER.forEach(f=>{
    const ft = tasks.filter(x=>x.f===f); if(!ft.length) return;
    h += `<div class="label">${formIcon(f,26)}<span style="color:var(--ink)">${esc(L(FM(f)))}</span></div><div class="tasks">`;
    [...new Set(ft.map(x=>x.m))].forEach(m=>{
      h += `<div class="task"><div class="task-h"><b>${esc(L(MC(m)))}</b></div><div class="slots">`;
      ft.filter(x=>x.m===m).forEach(({i})=>{
        const st = slotState(f,m,i,date);
        const icon = st.rec ? (st.rec.result==="OK"?ico("check"):st.rec.result==="X"?ico("alert"):ico("minus")) : "";
        h += `<button class="slot s-${st.cls}" data-act="open" data-f="${f}" data-m="${m}" data-s="${i}"><small>${esc(slotLabel(f,i))}${st.sub?" · "+esc(st.sub):""}</small><span style="display:flex;gap:6px;align-items:center">${icon}${esc(st.txt)}</span></button>`;
      });
      h += `</div></div>`;
    });
    h += `</div>`;
  });
  return h+review;
}

const blankItem = F => F.pos ? {pos:{T:"OK",G:"OK",P:"OK"},chips:[],note:""} : {r:"OK",chips:[],note:"",meas:""};
function newDraft(f,m,s){
  const ex = S.recs[recId(S.date,f,m,s)];
  if(ex) return clone(ex);
  const F = FM(f); const items = {};
  activeItems(f).forEach(it=>{ items[it.c] = blankItem(F); });
  let product = "";
  if(F.product) for(let i=s-1;i>=0;i--){ const p=S.recs[recId(S.date,f,m,i)]; if(p&&p.product){product=p.product;break;} }
  return {id:recId(S.date,f,m,s),date:S.date,form:f,machine:m,slot:s,status:"run",product,items,loai2:[]};
}

  h += `<div class="week">`;

  h += `<div class="agrid">`;

    const F = FM(f);
    h += `<div class="card"><h3>${formIcon(f)}${esc(L(F))}</h3>`;

      });
      h += `</div>`;

    h += `</div>`;
  });
  return h+`</div>`;

async function saveAssign(dept, map, date){
  date = date || S.aDate;
  const e = meEmp(), n = new Date();
  const doc = {date, dept, map, by:e.id, byName:e.name, time:hm(n)+" "+shortDate(todayStr()), at:n.toISOString()};
  await store.setDoc("assign", date+"_"+dept, doc);
  S.aWeekDocs[date+"_"+dept]=doc;

const GRACE = 30;
function outcome(date,f,i,rec){
  const due = toMin(FM(f).slots[i]?.t)+GRACE;
  if(rec){
    if(rec.result==="STOP") return {st:"stop", late:false};
    const late = toMin(rec.time) > due;
    return {st: rec.result==="X"?"ng":"ok", late};
  }
  const td=todayStr(), now=new Date(), nm=now.getHours()*60+now.getMinutes();
  if(date<td || (date===td && nm>due)) return {st:"miss", late:false};
  return {st:"pending", late:false};
}
function stateBadge(o, rec){
  const map = {ok:["b-ok","check",t("stOK")], ng:["b-bad","alert",t("stNG")], miss:["b-warn","x",t("stMiss")], pending:["b-wait","clock",t("stPending")], stop:["b-stop","minus",t("stStop")]};
  const [c,i,l] = map[o.st];
  return `<span class="badge ${c}">${ico(i)}${l}${rec&&rec.time?" "+esc(rec.time):""}</span>${o.late?`<span class="badge b-warn">${ico("clock")}${t("stLate")}</span>`:""}`;
}

function confirmRows(dept, date){
  const amap = (S.assign[date+"_"+dept]||{}).map||{};
  const rows = [];
  deptSlots(dept).forEach(({f,m,i})=>{
    const who = amap[aKey(f,m,i)]||"", rec = S.recs[recId(date,f,m,i)];
    if(!who && !rec) return;
    rows.push({f,m,i,who:rec?rec.worker:who,rec,...outcome(date,f,i,rec)});
  });
  return rows;
}

const ymOf = d => d.slice(0,7);
const monthStart = ym => ym+"-01";
const monthEnd = ym => { const [y,m]=ym.split("-").map(Number); return ymd(new Date(y,m,0)); };
const addMonths = (ym,n) => { const [y,m]=ym.split("-").map(Number); const d=new Date(y,m-1+n,1); return d.getFullYear()+"-"+pad(d.getMonth()+1); };
const monthsLen = (a,b) => { const [y1,m1]=a.split("-").map(Number), [y2,m2]=b.split("-").map(Number); return (y2-y1)*12+(m2-m1)+1; };
const datesBetween = (a,b) => { const out=[]; for(let d=a; d<=b; d=shiftDate(d,1)) out.push(d); return out; };
const showYm = ym => { const [y,m]=ym.split("-"); return (LANG==="jp"?`${y}年${+m}月`:`Tháng ${m}/${y}`); };
async function rangeMonths(col, fromYm, toYm){
  let out=[];
  for(let ym=fromYm; ym<=toYm; ym=addMonths(ym,1)) out = out.concat(await store.range(col, monthStart(ym), monthEnd(ym)));
  return out;
}
function dashForms(e){ const fs = scopeForms(e); return S.dForm==="all" || !fs.includes(S.dForm) ? fs : [S.dForm]; }
function prevRange(){ const n=monthsLen(S.dFrom,S.dTo); return [addMonths(S.dFrom,-n), addMonths(S.dFrom,-1)]; }
async function loadDash(){
  const key = S.dFrom+"_"+S.dTo; S.dKey = key; S.dLoading = true; render();
  try{
    const [pf] = prevRange();
    const [rows, assigns] = await Promise.all([rangeMonths("checks", pf, S.dTo), rangeMonths("assign", pf, S.dTo)]);
    if(S.dKey!==key) return;
    S.dData = {rows, assigns};
  }catch(err){ toastErr(t("saveErr")); }
  S.dLoading = false; refresh();
}
function collect(from, to, forms){
  const D = S.dData; if(!D) return {slots:[], unassigned:0};
  const end = to < todayStr() ? to : todayStr();
  const recBy = {}; let first = "9999";
  D.rows.forEach(r=>{ if(r.date>=from && r.date<=end && forms.includes(r.form) && FM(r.form)){ recBy[r.id]=r; if(r.date<first) first=r.date; } });
  const amap = {};
  D.assigns.forEach(a=>{ if(a.date>=from && a.date<=end){ Object.entries(a.map||{}).forEach(([k,v])=>{ if(forms.includes(k.split("|")[0])){ amap[a.date+"|"+k]=v; if(a.date<first) first=a.date; } }); } });
  const slots = []; let unassigned = 0;
  if(first==="9999") return {slots, unassigned};
  datesBetween(first>from?first:from, end).forEach(d=>forms.forEach(f=>activeMachines(f).forEach(m=>FM(f).slots.forEach((s,i)=>{
    const who = amap[d+"|"+aKey(f,m,i)]||"", rec = recBy[recId(d,f,m,i)];
    if(!who && !rec){ unassigned++; return; }
    slots.push({date:d,f,m,i,assignee:who,who:rec?rec.worker:who,rec,...outcome(d,f,i,rec)});
  }))));
  return {slots, unassigned};
}
function applyFilt(slots){
  const F = S.dFilt; if(!F) return slots;
  return slots.filter(x=>{
    if(F.t==="mach") return x.f+"|"+x.m===F.v;
    if(F.t==="emp") return x.who===F.v;
    if(F.t==="day") return x.date===F.v;
    if(F.t==="prod") return x.rec && (x.rec.product||"—")===F.v;
    if(F.t==="item"){ const [f,c]=F.v.split("|"); return x.f===f && x.rec && x.rec.status==="run" && itemIsX(FM(f), x.rec.items?.[c]); }
    if(F.t==="err") return x.rec && ((x.rec.loai2||[]).some(l=>l.err===F.v) || Object.values(x.rec.items||{}).some(v=>(v.chips||[]).includes(F.v)));
    return true;
  });
}
function stats(slots){
  const s = {due:0,onTime:0,checks:0,ng:0,late:0,miss:0,l2:0,open:0};
  slots.forEach(x=>{
    if(x.st!=="pending" && x.assignee) s.due++;
    if(x.rec){ s.checks++; if(!x.late && x.assignee) s.onTime++; if(x.late) s.late++;
      if(x.st==="ng"){ s.ng++; if(!x.rec.close) s.open++; }
      (x.rec.loai2||[]).forEach(l=>s.l2+=l.doi); }
    if(x.st==="miss") s.miss++;
  });
  s.comp = s.due ? s.onTime/s.due : null;
  s.ngRate = s.checks ? s.ng/s.checks : null;
  return s;
}
const fTag = (t_,v,label) => `data-act="filt" data-t="${t_}" data-v="${esc(v)}" data-l="${esc(label)}"`;
const isF = (t_,v) => S.dFilt && S.dFilt.t===t_ && S.dFilt.v===v;
function kpiCard(title, val, sub, cmp, color){

function cmpTxt(cur, prev, goodUp, fmt, hasPrev){
  if(!hasPrev) return `<span class="muted">${t("noPrev")}</span>`;
  if(cur==null || prev==null) return `<span class="muted">${t("prev")}: —</span>`;
  const d = cur-prev;
  if(Math.abs(d)<1e-9) return `<span class="delta d-flat">= ${t("prev")}</span>`;
  const good = goodUp ? d>0 : d<0;
  return `<span class="delta ${good?"d-good":"d-bad"}">${d>0?"▲":"▼"} ${fmt(Math.abs(d))}</span> <span class="muted">${t("prev")}: ${fmt(prev)}</span>`;
}
function hbar(rows, opts){

function dayChart(days, key, color, unit){
  const W=560,H=150,L0=30,R0=6,T0=10,B0=22;
  const vals = days.map(d=>d[key]); const mx = Math.max(1,...vals);
  const step = mx<=4?1:mx<=10?2:mx<=20?5:mx<=50?10:mx<=100?20:mx<=250?50:Math.ceil(mx/500)*100;
  const top = Math.ceil(mx/step)*step, y = v => T0+(H-T0-B0)*(1-v/top);
  const bw = (W-L0-R0)/Math.max(1,days.length), bwid = Math.max(2,Math.min(18,bw*0.6));
  const every = Math.max(1, Math.ceil(days.length/8));
  const sel = S.dFilt && S.dFilt.t==="day" ? S.dFilt.v : null;
  let g = "";
  for(let v=0; v<=top; v+=step) g += `<line x1="${L0}" x2="${W-R0}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L0-5}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  days.forEach((d,i)=>{
    const cx=L0+bw*i+bw/2, v=d[key], x0=cx-bwid/2, yy=y(v), rr=Math.min(3,(H-B0-yy),bwid/2);
    if(v>0) g += `<path d="M${x0} ${H-B0} V${yy+rr} Q${x0} ${yy} ${x0+rr} ${yy} H${x0+bwid-rr} Q${x0+bwid} ${yy} ${x0+bwid} ${yy+rr} V${H-B0} Z" fill="${color}" opacity="${sel&&sel!==d.date?.35:1}"/>`;
    g += `<rect x="${L0+bw*i}" y="${T0}" width="${bw}" height="${H-T0-B0}" fill="transparent" style="cursor:pointer" ${fTag("day",d.date,showDate(d.date))} data-tip="${esc(showDate(d.date)+"\n"+v+" "+unit)}"/>`;
    if(i%every===0) g += `<text x="${cx}" y="${H-6}" text-anchor="middle">${shortDate(d.date)}</text>`;
  });
  g += `<line x1="${L0}" x2="${W-R0}" y1="${H-B0}" y2="${H-B0}" stroke="var(--line)"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(unit)}">${g}</svg>`;
}

  return `<div class="tbl-wrap"><svg class="heat" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("heat"))}">${g}</svg></div>`;

    ${kpiCard(t("kL2b"), st.l2.toLocaleString("vi-VN"), t("kL2Sub"), cmpTxt(st.l2,ps.l2,false,v=>v.toLocaleString("vi-VN"),hasPrev), "")}
    ${kpiCard(t("kLM"), st.late+st.miss, fill(t("kLMSub"),{a:st.late,b:st.miss}), cmpTxt(st.late+st.miss,ps.late+ps.miss,false,v=>v,hasPrev), st.late+st.miss?"var(--warn)":"")}
    ${kpiCard(t("kOpen"), st.open, t("kOpenSub"), "", st.open?"var(--bad)":"var(--ok)")}</div>`;
  h += `<div class="dgrid" style="margin-top:14px">`;
  /* Pareto loại lỗi */
  const errAgg = {}; slots.forEach(x=>x.rec&&(x.rec.loai2||[]).forEach(l=>errAgg[l.err]=(errAgg[l.err]||0)+l.doi));
  const errTot = Object.values(errAgg).reduce((a,b)=>a+b,0); let cum=0;
  const errRows = Object.keys(errAgg).sort((a,b)=>errAgg[b]-errAgg[a]).map(k=>{ cum+=errAgg[k]; const nm=L(S.master.errors.find(x=>x.id===k))||k;
    return {key:k,label:nm,v:errAgg[k],vTxt:errAgg[k].toLocaleString("vi-VN"),sub:Math.round(cum/errTot*100)+"%",tip:`${nm}\n${errAgg[k]} ${t("pair")} · ${Math.round(errAgg[k]/errTot*100)}%\n${t("cumul")} ${Math.round(cum/errTot*100)}%`}; });
  h += `<div class="card span6"><h3>${ico("bug")}${t("pErr")}<span class="sub">${errTot.toLocaleString("vi-VN")} ${t("pair")}</span></h3><p class="csub">${t("pErrSub")}</p>${hbar(errRows,{t:"err",color:"var(--accent)"})}</div>`;
  /* hạng mục NG */
  const itAgg = {}; slots.forEach(x=>{ if(!x.rec||x.rec.status!=="run") return; const F=FM(x.f); Object.entries(x.rec.items||{}).forEach(([c,v])=>{ if(itemIsX(F,v)){ const k=x.f+"|"+c; itAgg[k]=(itAgg[k]||0)+1; } }); });
  const itRows = Object.keys(itAgg).sort((a,b)=>itAgg[b]-itAgg[a]).slice(0,10).map(k=>{ const [f,c]=k.split("|"); const it=FM(f).items.find(i=>i.c===c);
    return {key:k,label:L(it)||c,pre:formIcon(f,22),v:itAgg[k],vTxt:itAgg[k]+" "+t("times"),tip:`${L(it)} · ${L(FM(f))}\n${itAgg[k]} ${t("times")} NG`}; });
  h += `<div class="card span6"><h3>${ico("alert")}${t("pItem")}<span class="sub">${st.ng} ${t("times")}</span></h3>${hbar(itRows,{t:"item",color:"var(--bad)"})}</div>`;
  /* máy */
  const mAgg = {}; slots.forEach(x=>{ if(!x.rec) return; const k=x.f+"|"+x.m; const a=mAgg[k]||={c:0,ng:0,l2:0}; a.c++; if(x.st==="ng") a.ng++; (x.rec.loai2||[]).forEach(l=>a.l2+=l.doi); });
  const mRows = Object.keys(mAgg).filter(k=>mAgg[k].ng||mAgg[k].l2).sort((a,b)=>(mAgg[b].ng/mAgg[b].c)-(mAgg[a].ng/mAgg[a].c)||mAgg[b].l2-mAgg[a].l2).slice(0,10).map(k=>{ const [f,m]=k.split("|"), a=mAgg[k];
    return {key:k,label:L(MC(m)),pre:formIcon(f,22),v:a.ng/a.c,vTxt:Math.round(a.ng/a.c*100)+"%",sub:`${a.ng}/${a.c} ${t("times")}${a.l2?" · "+a.l2+" "+t("pair"):""}`,tip:`${L(MC(m))} · ${L(FM(f))}\nNG ${a.ng}/${a.c}\n${t("l2")}: ${a.l2} ${t("pair")}`}; });
  h += `<div class="card span6"><h3>${ico("factory")}${t("pMach")}</h3><p class="csub">${t("pMachSub")}</p>${hbar(mRows,{t:"mach",color:"var(--bad)"})}</div>`;
  /* theo ngày */
  const dAgg = {}; datesBetween(from, to<td?to:td).forEach(d=>dAgg[d]={date:d,l2:0,ng:0});
  slots.forEach(x=>{ if(!x.rec||!dAgg[x.date]) return; if(x.st==="ng") dAgg[x.date].ng++; (x.rec.loai2||[]).forEach(l=>dAgg[x.date].l2+=l.doi); });
  const dArr = Object.values(dAgg);
  h += `<div class="card span6"><h3>${ico("trend")}${t("pDay")}</h3><div class="mini-h">${t("pDayL2")}</div>${dayChart(dArr,"l2","var(--accent)",t("pair"))}<div class="mini-h">${t("pDayNG")}</div>${dayChart(dArr,"ng","var(--bad)",t("times")+" NG")}</div>`;
  /* mã hàng */
  const pAgg = {}; slots.forEach(x=>{ if(!x.rec||!x.rec.product) return; const k=x.rec.product; const a=pAgg[k]||={c:0,ng:0,l2:0}; a.c++; if(x.st==="ng") a.ng++; (x.rec.loai2||[]).forEach(l=>a.l2+=l.doi); });
  const pRows = Object.keys(pAgg).filter(k=>pAgg[k].ng||pAgg[k].l2).sort((a,b)=>pAgg[b].l2-pAgg[a].l2||pAgg[b].ng-pAgg[a].ng).slice(0,10).map(k=>{ const a=pAgg[k];
    return {key:k,label:k,v:a.l2||a.ng,vTxt:a.l2+" "+t("pair"),sub:`NG ${a.ng}/${a.c}`,tip:`${k}\n${t("l2")}: ${a.l2} ${t("pair")}\nNG ${a.ng}/${a.c} ${t("times")}`}; });
  h += `<div class="card span6"><h3>${ico("box")}${t("pProd")}</h3>${hbar(pRows,{t:"prod",color:"var(--warn)"})}</div>`;
  /* NG gần đây */
  const recent = slots.filter(x=>x.st==="ng").sort((a,b)=>(b.date+b.rec.time).localeCompare(a.date+a.rec.time)).slice(0,8);
  h += `<div class="card span6"><h3>${ico("alert")}${t("recent")}<span class="sub">${st.open?`<span class="badge b-bad">${st.open} ${t("openNG").toLowerCase()}</span>`:""}</span></h3><div class="feed">`;
  if(!recent.length) h += `<p class="muted" style="margin:0">${t("noIssue")}</p>`;
  recent.forEach(x=>{ const F=FM(x.f); const bad=F.items.filter(it=>itemIsX(F,x.rec.items?.[it.c])).map(it=>L(it)).join(", ");
    h += `<button class="issue" data-act="detail" data-id="${esc(x.rec.id)}"><span class="dot">${ico("alert")}</span><b>${esc(bad||t("stNG"))} · ${esc(L(MC(x.m)))}</b>
      <span>${x.rec.close?`<span class="badge b-ok">${ico("check")}${t("closed")}</span> <span class="muted" style="font-size:13px">${esc(x.rec.close.note)}</span>`:`<span class="badge b-bad">${t("openNG")}</span>`}</span>
      <span class="meta">${showDate(x.date)} · ${esc(slotLabel(x.f,x.i))} · ${esc(x.rec.workerName)}${x.rec.product?" · "+esc(x.rec.product):""}</span></button>`; });
  h += `</div></div>`;
  /* lịch tuân thủ */
  h += `<div class="card span12"><h3>${ico("cal")}${t("heat")}<span class="sub"><span class="legend"><span><i style="background:var(--ok)"></i>${t("stOK")}</span><span><i style="background:var(--bad)"></i>${t("stNG")}</span><span><i style="background:var(--warn)"></i>${t("stLate")}</span><span><i style="background:repeating-linear-gradient(45deg,var(--warn) 0 2px,var(--warn-bg) 2px 4px)"></i>${t("stMiss")}</span><span><i style="background:var(--stop)"></i>${t("stStop")}</span><span><i style="background:var(--sunk)"></i>${t("legNone")}</span></span></span></h3><p class="csub">${t("heatSub")}</p>${heatmap(slots, from, to, forms)}</div>`;
  /* nhân viên */
  const per = {}; slots.forEach(x=>{ if(!x.who) return; const p=per[x.who]||={due:0,done:0,on:0,late:0,miss:0,ng:0};
    if(x.st!=="pending") p.due++; if(x.rec){ p.done++; if(!x.late) p.on++; if(x.late) p.late++; if(x.st==="ng") p.ng++; } if(x.st==="miss") p.miss++; });
  const ids = Object.keys(per).sort((a,b)=>(per[b].miss+per[b].late)-(per[a].miss+per[a].late)||(emp(a)?.name||"").localeCompare(emp(b)?.name||""));
  h += `<div class="card span12"><h3>${ico("users")}${t("pPeople")}<span class="sub">${t("pPeopleSub")}</span></h3>`;
  if(!ids.length) h += `<p class="muted" style="margin:0">${t("noDataR")}</p>`;
  else h += `<div class="tbl-wrap"><table class="ptable"><thead><tr><th>${t("name")}</th><th>${t("dept")}</th><th class="num">${t("stAssigned")}</th><th class="num">${t("stDone")}</th><th class="num">${t("onTime")}</th><th style="min-width:110px"></th><th class="num">${t("stLate")}</th><th class="num">${t("stMiss")}</th><th class="num">${t("stNG")}</th></tr></thead><tbody>`+
    ids.map(id=>{ const p=per[id], x=emp(id)||{name:id}, r=p.due?p.on/p.due:null;
      return `<tr class="${isF("emp",id)?"on":""}" ${fTag("emp",id,x.name)} style="cursor:pointer"><td><span class="who">${avatar(x)}${esc(x.name)}</span></td><td class="muted">${esc(L(DEPTS[x.dept])||"")}</td><td class="num">${p.due}</td><td class="num">${p.done}</td>
        <td class="num"><b style="color:${r==null?"inherit":r>=.95?"var(--ok)":r>=.8?"var(--warn)":"var(--bad)"}">${pct(r)}</b></td><td><div class="mini"><i style="width:${r==null?0:r*100}%"></i></div></td>
        <td class="num" style="${p.late?"color:var(--warn);font-weight:700":""}">${p.late}</td><td class="num" style="${p.miss?"color:var(--warn);font-weight:700":""}">${p.miss}</td><td class="num" style="${p.ng?"color:var(--bad);font-weight:700":""}">${p.ng}</td></tr>`; }).join("")+`</tbody></table></div>`;
  h += `</div></div>`;
  return h;
}

const CATS = [
  {k:"employees",l:"cEmployees",i:"users"},{k:"products",l:"cProducts",i:"box"},{k:"errors",l:"cErrors",i:"bug"},
  {k:"machines",l:"cMachines",i:"factory"},{k:"forms",l:"cForms",i:"doc"},{k:"settings",l:"cSettings",i:"gear"}];
function vCat(){
  const m = S.master;
  let h = `<div class="adm"><nav class="adm-nav">`+CATS.map(c=>{
    const n = Array.isArray(m[c.k]) ? m[c.k].filter(x=>x.active).length : c.k==="forms" ? FORM_ORDER.length : "";
    return `<button aria-current="${S.cat===c.k}" data-act="cat" data-v="${c.k}">${ico(c.i)}${t(c.l)}<span>${n}</span></button>`;
  }).join("")+`</nav><section class="card">`;
  const c = CATS.find(x=>x.k===S.cat);
  h += `<h3>${ico(c.i)}${t(c.l)}</h3>`;

  else if(S.cat==="settings") h += vCatSettings();

      <div class="toolbar"><input id="catq" data-in="catq" placeholder="${esc(t("findCat"))}" value="${esc(S.catQ)}" autocomplete="off"></div>
      <div class="tbl-wrap" id="catlist">${vCatList()}</div>`;
  return h+`</section></div>`;
}
function vAddBox(){
  const k = S.cat;

  if(k==="employees") h += `<label class="fld" style="max-width:150px"><span>${t("idOpt")}</span><input id="a_code" placeholder="NV022"></label><label class="fld" style="flex:2"><span>${t("name")}</span><input id="a_name"></label>${sel("a_dept",DEPTS,t("dept"))}${sel("a_role",ROLES,t("role"))}`;

function dupOf(k, name, selfIdx){
  const n = norm(name); if(!n) return null;
  return S.master[k].find((x,i)=> i!==selfIdx && norm(x.name||x.vi)===n);
}
function vCatList(){
  const k = S.cat, q = norm(S.catQ), list = S.master[k];
  const match = x => !q || norm([x.id,x.name,x.vi,x.jp,x.aliases].join(" ")).includes(q);
  const sw = (i,on) => `<button class="sw" role="switch" aria-checked="${on}" aria-label="${t("active")}" data-act="toggleCat" data-i="${i}"></button>`;
  const inp = (i,f,v,w) => `<input class="ed" data-edit="${f}" data-i="${i}" value="${esc(v)}" style="min-width:${w}px">`;
  const sel = (i,f,obj,v) => `<select class="ed" data-edit="${f}" data-i="${i}">`+Object.keys(obj).map(x=>`<option value="${x}" ${x===v?"selected":""}>${esc(L(obj[x]))}</option>`).join("")+`</select>`;
  let rows="";
  list.forEach((x,i)=>{
    if(!match(x)) return;
    const cls = x.active?"":"off";
    if(k==="products") rows += `<tr class="${cls}"><td class="mono">${x.id}</td><td>${inp(i,"name",x.name,170)}</td><td>${inp(i,"aliases",x.aliases,170)}</td><td>${sel(i,"type",PTYPES,x.type)}</td><td>${sw(i,x.active)}</td></tr>`;
    if(k==="employees"){
      const has = S.authSet.has(x.id);
      rows += `<tr class="${cls}"><td class="mono" style="font-weight:700;color:var(--ink)">${x.id}</td><td>${inp(i,"name",x.name,150)}</td><td>${sel(i,"dept",DEPTS,x.dept)}</td><td>${sel(i,"role",ROLES,x.role)}</td>
        <td><span style="display:flex;gap:6px;align-items:center"><span class="badge ${has?"b-ok":"b-wait"}">${has?t("pwIsSet"):t("pwIsDefault")}</span>${has?`<button class="ghost" style="min-height:34px;padding:0 10px;font-size:13px" data-act="pwReset" data-id="${x.id}">${ico("key")}${t("pwReset")}</button>`:""}</span></td><td>${sw(i,x.active)}</td></tr>`;
    }
    if(k==="errors") rows += `<tr class="${cls}"><td class="mono">${x.id}</td><td>${inp(i,"vi",x.vi,150)}</td><td>${inp(i,"jp",x.jp,130)}</td><td>${sel(i,"type",PTYPES,x.type)}</td><td>${sw(i,x.active)}</td></tr>`;
    if(k==="machines"){
      const used = FORM_ORDER.filter(f=>FM(f).machines.includes(x.id)).map(f=>L(FM(f))).join(", ");
      rows += `<tr class="${cls}"><td class="mono">${x.id}</td><td>${inp(i,"vi",x.vi,140)}</td><td>${inp(i,"jp",x.jp,110)}</td><td class="muted" style="font-size:13px;min-width:160px">${esc(used)||"—"}</td><td>${sw(i,x.active)}</td></tr>`;
    }
  });
  const head = {products:[t("code"),t("name"),t("aliases"),t("ptype"),t("active")],employees:[t("empId"),t("name"),t("dept"),t("role"),t("pwCol"),t("active")],
    errors:[t("code"),t("nameVi"),t("nameJp"),t("ptype"),t("active")],machines:[t("code"),t("nameVi"),t("nameJp"),t("usedBy"),t("active")]}[k];
  return `<table class="cat"><thead><tr>${head.map(x=>`<th>${esc(x)}</th>`).join("")}</tr></thead><tbody>${rows||`<tr><td colspan="6" class="muted">—</td></tr>`}</tbody></table>`;
}
function vCatForms(){

  let h = `<div class="mchips" style="margin-bottom:6px">`+FORM_ORDER.map(x=>`<button class="mchip" aria-pressed="${x===f}" data-act="formSel" data-v="${x}">${esc(L(FM(x)))}</button>`).join("")+`</div>`;

/* ===================== THAO TÁC ===================== */
function toast(msg){ const d=document.createElement("div"); d.className="toast"; d.innerHTML=ico("check")+esc(msg); document.body.appendChild(d); setTimeout(()=>d.remove(),1500); }
function toastErr(msg){ const d=document.createElement("div"); d.className="toast"; d.style.background="var(--bad)"; d.innerHTML=ico("alert")+esc(msg); document.body.appendChild(d); setTimeout(()=>d.remove(),2600); }
const busyEditing = () => { const a=document.activeElement; return a && a.matches && a.matches("input,select,textarea") && !a.closest(".sheet"); };
function refresh(){ if(S.view==="main" && !busyEditing()) render(); }

/* tải dữ liệu theo tab */
function loadData(){
  const e = meEmp(); if(!e) return;
  store.stopAll(); S.recs = {}; S.assign = {}; S.appr = {};
  if(S.tab==="sum"){ loadDash(); return; }
  const date = S.tab==="assign" ? S.aDate : S.tab==="confirm" ? S.cDate : todayStr();
  store.watchByDate("checks", date, m=>{ const o={}; Object.values(m).forEach(r=>o[r.id]=r); S.recs=o; refresh(); });
  store.watchByDate("assign", date, m=>{ S.assign=m; refresh(); });
  store.watchByDate("approvals", date, m=>{ S.appr=m; refresh(); });
  if(S.tab==="assign"){ const ws=wkStart(S.aDate); store.range("assign", ws, shiftDate(ws,6)).then(rows=>{ S.aWeekDocs=Object.fromEntries(rows.map(r=>[r._id,r])); refresh(); }).catch(()=>{}); }
  if(S.tab==="confirm"){ const td=todayStr(); store.range("approvals", shiftDate(td,-6), td).then(rows=>{ S.apprWeek=Object.fromEntries(rows.map(r=>[r._id,r])); refresh(); }).catch(()=>{}); }
  if(S.tab==="input" && manageDepts(e).length){
    const td=todayStr(), a=shiftDate(td,-6); S.rev=null;
    Promise.all([store.range("checks",a,td), store.range("assign",a,td), store.range("approvals",a,td)]).then(([c,as,ap])=>{
      const strip = r => { const {_id,...x}=r; return x; };
      S.rev = {checks:Object.fromEntries(c.map(r=>[r.id,strip(r)])), assign:Object.fromEntries(as.map(r=>[r._id,strip(r)])), appr:Object.fromEntries(ap.map(r=>[r._id,strip(r)]))};
      refresh();
    }).catch(()=>{ S.rev={checks:{},assign:{},appr:{}}; refresh(); });
  }
  if(S.tab==="cat" && isAD(e)) store.listIds("auth").then(ids=>{ S.authSet=new Set(ids); refresh(); }).catch(()=>{});
}
function goMain(){ S.view="main"; S.draft=null; S.err=""; S.sheet=null; loadData(); render(); window.scrollTo(0,0); }
function startSession(id, remember){
  S.me=id;
  try{ localStorage.setItem("qc_lastid", id); if(remember) localStorage.setItem("qc_session", JSON.stringify({id, exp:Date.now()+30*864e5})); else localStorage.removeItem("qc_session"); }catch(e){}
  const e=meEmp(); S.tab = "input"; S.trendFor="";
  if(e && isLead(e) && !manageDepts(e).length) S.tab = "sum";
}
function logout(){
  S.me=null; S.sheet=null; S.view="login"; S.login.err=""; store.stopAll();
  try{ localStorage.removeItem("qc_session"); }catch(e){}
  render(); window.scrollTo(0,0);
}
function normId(s){
  s = String(s||"").trim().toUpperCase().replace(/\s+/g,"");
  if(/^\d+$/.test(s)) s = "NV"+s.padStart(3,"0");
  return s;
}
async function doLogin(){
  const lg = S.login;
  const id = normId(document.getElementById("lid").value), pw = document.getElementById("lpw").value, rem = document.getElementById("lrem").checked;
  lg.id = id;
  if(Date.now() < lg.until){ lg.err=t("tooMany"); render(); return; }
  const e = S.master.employees.find(x=>x.id.toUpperCase()===id);
  let ok=false, forced=false;
  if(e){
    let auth=null; try{ auth = await store.getDoc("auth", e.id); }catch(err){}
    if(auth && auth.hash){ ok = (await hashPw(pw, auth.salt)) === auth.hash; }
    else { ok = pw===DEFAULT_PW; forced = ok; }
  }
  if(ok && !e.active){ lg.err=t("inactive"); render(); return; }
  if(!ok){ lg.fails++; if(lg.fails>=5){ lg.until=Date.now()+30000; lg.fails=0; } lg.err=t("badLogin"); render(); document.getElementById("lpw")?.focus(); return; }
  lg.err=""; lg.fails=0;
  startSession(e.id, rem);
  if(forced){ S.pwForced=true; S.view="pw"; S.err=""; render(); return; }
  goMain();
}
async function doSetPw(){
  const p1=document.getElementById("np1").value, p2=document.getElementById("np2").value;
  if(p1.length<4){ S.err=t("pwShort"); render(); return; }
  if(p1!==p2){ S.err=t("pwMismatch"); render(); return; }
  if(p1===DEFAULT_PW){ S.err=t("pwDefault"); render(); return; }
  const salt=newSalt(), hash=await hashPw(p1,salt), e=meEmp();
  try{ await store.setDoc("auth", e.id, {hash, salt, at:new Date().toISOString()}); }catch(err){ S.err=t("saveErr"); render(); return; }
  S.pwForced=false; S.err=""; toast(t("pwSaved")); goMain();
}

document.addEventListener("submit", ev=>{

async function addCat(){
  const k=S.cat, val=id=>(document.getElementById(id)?.value||"").trim();
  const name=val("a_name"), msg=document.getElementById("addmsg");
  if(!name){ msg.textContent=t("need"); return; }
  const dup = k==="employees" ? null : dupOf(k,name,-1);
  if(dup){ msg.textContent=`${t("dup")}: ${dup.id} · ${dup.name||dup.vi}`; return; }
  const m=clone(S.master), list=m[k];
  if(k==="products") list.push({id:nextId(list,"SP",3),name,aliases:val("a_alias"),type:val("a_type"),active:true});
  if(k==="employees"){
    let id = normId(val("a_code")).replace(/[^A-Z0-9_-]/g,"") || nextId(list,"NV",3);
    if(list.some(x=>x.id.toUpperCase()===id)){ msg.textContent=`${t("idTaken")}: ${id}`; return; }
    list.push({id,name,dept:val("a_dept"),role:val("a_role"),active:true});
  }
  if(k==="errors"){ const i=list.findIndex(x=>norm(x.vi)==="khac"); const row={id:nextId(list,"L",2),vi:name,jp:val("a_jp")||name,type:val("a_type"),active:true}; i>=0?list.splice(i,0,row):list.push(row); }
  if(k==="machines"){ const code=val("a_code").toUpperCase().replace(/[^A-Z0-9]/g,""); if(!code){ msg.textContent=t("code")+"?"; return; }
    if(list.some(x=>x.id===code)){ msg.textContent=`${t("dup")}: ${code}`; return; }
    list.push({id:code,vi:name,jp:val("a_jp")||name,active:true}); }
  await saveMaster(m,t("saved"));
}

async function doSave(){
  const d = S.draft, F = FM(d.form), e = meEmp();
  S.err = "";
  if(assignedTo(d.form,d.machine,d.slot)!==e.id){ S.err=t("notMine"); render(); return; }
  const ex = S.recs[d.id];
  if(ex && ex.worker!==e.id){ S.err=t("notMine"); render(); return; }
  if(S.appr[d.date+"_"+deptOfForm(d.form)]){ S.err=t("locked"); render(); return; }
  if(d.status==="run"){
    if(F.product==="req" && !d.product){ S.err=t("needProduct"); render(); window.scrollTo(0,0); return; }
    const bad = activeItems(d.form).find(it=>{ const v=d.items[it.c]; return itemIsX(F,v) && !v.chips.length && !v.note.trim(); });
    if(bad){ S.err=t("needX"); render(); document.getElementById("it-"+bad.c)?.scrollIntoView({block:"center"}); return; }
  }
  const n = new Date();
  Object.values(d.items).forEach(v=>{ if(!itemIsX(F,v)){ v.chips=[]; v.note=""; } });
  const anyX = d.status==="run" && activeItems(d.form).some(it=>itemIsX(F,d.items[it.c]));
  const rec = {...d, worker:e.id, workerName:e.name,
    result: d.status!=="run" ? "STOP" : anyX ? "X" : "OK",
    time: ex && d.time ? d.time : hm(n), savedAt:n.toISOString()};
  if(ex) rec.editedAt = n.toISOString();
  if(d.status!=="run") rec.loai2 = [];
  try{ await store.setDoc("checks", rec.id, rec); }catch(err){ S.err=t("saveErr"); render(); return; }
  S.recs[rec.id] = rec;
  toast(t("saved"));
  goMain();
}

const scopeRows = (rows,e) => { const fs=scopeForms(e); return rows.filter(r=>fs.includes(r.form)); };
async function doExport(){
  const ym = S.dFrom===S.dTo ? S.dFrom : S.dFrom+"_"+S.dTo;
  const fs = dashForms(meEmp());
  let rows; try{ rows = (await rangeMonths("checks", S.dFrom, S.dTo)).filter(r=>fs.includes(r.form)); }catch(e){ toastErr(t("saveErr")); return; }
  rows.sort((a,b)=> (a.date+a.form+a.machine+a.slot) < (b.date+b.form+b.machine+b.slot) ? -1 : 1);
  const out = [["Ngày","Phiếu","Máy","Lần","Giờ","Đúng giờ","Mã NV","Người kiểm","Mã hàng","Trạng thái máy","Hạng mục","Vị trí","Kết quả","Lỗi / Xử lý","Ghi chú","Số đo","Loại 2 (đôi)","Khép NG"]];
  const st = {run:"Chạy",broken:"Hỏng",off:"Không SX"};
  rows.forEach(r=>{
    const F = FM(r.form); if(!F) return;
    const base = [showDate(r.date),F.vi,MC(r.machine).vi,F.slots[r.slot]?.vi||("Lần "+(r.slot+1)),r.time,outcome(r.date,r.form,r.slot,r).late?"Trễ":"Đúng giờ",r.worker,r.workerName,r.product||"",st[r.status]||r.status];
    const cl = r.close ? r.close.name+": "+r.close.note : (r.result==="X"?"Chưa":"");
    if(r.status!=="run"){ out.push([...base,"","","","",r.stopNote||"","","",""]); return; }
    F.items.filter(it=>r.items[it.c]).forEach(it=>{
      const v = r.items[it.c];
      const chips = (v.chips||[]).map(id=>((F.chips==="err"?S.master.errors:ACTS).find(c=>c.id===id)||{vi:id}).vi).join(", ");
      if(F.pos) ["T","G","P"].forEach(p=>{ const x=v.pos?.[p]==="X"; out.push([...base,it.vi,POSN[p].vi,x?"X":"Đạt",x?chips:"",x?(v.note||""):"","","",x?cl:""]); });
      else out.push([...base,it.vi,"",v.r==="X"?"X":"Đạt",chips,v.note||"",v.meas||"","",v.r==="X"?cl:""]);
    });
    (r.loai2||[]).forEach(x=>out.push([...base,"Loại 2","","",(S.master.errors.find(y=>y.id===x.err)||{vi:x.err}).vi,"","",x.doi,""]));
  });
  const csv = "﻿"+out.map(r=>r.map(c=>{ const s=String(c??""); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(",")).join("\r\n");
  await offerFile(`Kachiboshi_QC_${ym}.csv`, csv, "text/csv");
}
async function doBackup(){
  try{
    const strip = rows => Object.fromEntries(rows.map(r=>{ const {_id,...rest}=r; return [_id,rest]; }));
    const all = ["0000-00-00","9999-99-99"];
    const data = {app:"kachiboshi-qc",version:3,exportedAt:new Date().toISOString(),master:S.master,
      checks:strip(await store.range("checks",...all)), assign:strip(await store.range("assign",...all)), approvals:strip(await store.range("approvals",...all))};
    await offerFile(`Kachiboshi_QC_saoluu_${todayStr()}.json`, JSON.stringify(data,null,1), "application/json");
  }catch(e){ toastErr(t("saveErr")); }
}
async function doRestore(file){
  try{
    const data = JSON.parse(await file.text());
    if(!data || data.app!=="kachiboshi-qc") throw 0;
    if(data.master){ const m=mergeMaster(data.master); await store.saveMaster(m); S.master=m; }
    let n=0;
    const toEntries = x => Array.isArray(x) ? x.map(r=>[r.id,r]) : Object.entries(x||{});
    for(const [id,r] of toEntries(data.checks)){ if(id && r && r.date){ await store.setDoc("checks",id,r); n++; } }
    for(const [id,r] of toEntries(data.assign)){ if(id && r && r.date) await store.setDoc("assign",id,r); }
    for(const [id,r] of toEntries(data.approvals)){ if(id && r && r.date) await store.setDoc("approvals",id,r); }
    toast(`${t("restored")} ${n} ${t("records")}`); S.trendFor=""; loadData(); render();
  }catch(e){ toastErr(t("badFile")); }
}

/* ===================== KHỞI ĐỘNG ===================== */
(async function start(){
  try{ S.login.id = localStorage.getItem("qc_lastid") || ""; }catch(e){}
  render();
  await store.init();
  let first = true;
  store.watchMaster(m=>{
    S.master = mergeMaster(m);
    if(first){
      first = false;
      let sess=null; try{ sess=JSON.parse(localStorage.getItem("qc_session")); }catch(e){}
      if(sess && sess.exp>Date.now() && emp(sess.id)?.active){ startSession(sess.id,true); goMain(); return; }
    }
    if(S.view!=="form" && !busyEditing()) render();
  });
})();
</script>
